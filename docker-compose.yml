services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: syncspace
      POSTGRES_USER: syncspace
      POSTGRES_PASSWORD: syncspace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncspace -d syncspace"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  server:
    build: ./server
    environment:
      DATABASE_URL: postgres://syncspace:syncspace@postgres:5432/syncspace
      REDIS_URL: redis://redis:6379/0
      SYNCSPACE_JWT_SECRET: change-me-in-local-docker
      SYNCSPACE_DB_PATH: /data/syncspace.db
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - auth_data:/data

  client:
    build: ./client
    environment:
      VITE_API_URL: http://localhost:8080
    ports:
      - "3001:80"
    depends_on:
      server:
        condition: service_started

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: ["/app/worker"]
    environment:
      DATABASE_URL: postgres://syncspace:syncspace@postgres:5432/syncspace
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
  auth_data: